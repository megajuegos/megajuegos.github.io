{% assign sorted_sections = include.sections | sort: "order" %}
{% for section in sorted_sections %}
  <section id="three" class="wrapper style3 special">
    <div class="inner">
      <header class="major">
        <h2>{{ section.title }}</h2>
      </header>
      <ul class="features">
        {% for member in section.members %}
          <li>
            <img class="headshot" src="{{ member.image }}" alt="{{ member.image_alt | default: member.name }}" />
            <h3>{{ member.name }}</h3>
            {{ member.bio | markdownify }}
          </li>
        {% endfor %}
      </ul>
    </div>
  </section>
{% endfor %}
